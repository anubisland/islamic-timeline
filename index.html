<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#063529" />
  <title data-ar="الخط الزمني للعهد المدني" data-en="The Madani Era Timeline">الخط الزمني للعهد المدني</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Islamic ornaments in corners -->
  <div class="ornament ornament--tl" aria-hidden="true">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none">
      <path d="M12 2L15 9L22 12L15 15L12 22L9 15L2 12L9 9Z" fill="#C5A059" opacity="0.3" />
      <path d="M12 5L14 10L19 12L14 14L12 19L10 14L5 12L10 10Z" fill="#C5A059" />
    </svg>
  </div>
  <div class="ornament ornament--tr" aria-hidden="true">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none">
      <path d="M12 2L15 9L22 12L15 15L12 22L9 15L2 12L9 9Z" fill="#C5A059" opacity="0.3" />
      <path d="M12 5L14 10L19 12L14 14L12 19L10 14L5 12L10 10Z" fill="#C5A059" />
    </svg>
  </div>

  <main class="container">
    <div class="header">
      <button id="langToggle" class="lang-button" type="button" aria-label="Toggle language">
        <span data-ar="English" data-en="العربية">English</span>
      </button>
    </div>

    <header class="title-container">
      <h1 class="app-title" data-ar="الخط الزمني للعهد المدني" data-en="The Madani Era Timeline">
        الخط الزمني للعهد المدني
      </h1>
      <div class="gold-divider" aria-hidden="true"></div>
    </header>

    <article class="event-card">
      <h2 class="event-title" data-ar="١. بناء المسجد النبوي الشريف" data-en="1. Building of Al-Masjid an-Nabawi">
        ١. بناء المسجد النبوي الشريف
      </h2>
      <p class="quran-verse"
         data-ar="﴿ لَّمَسْجِدٌ أُسِّسَ عَلَى التَّقْوَىٰ مِنْ أَوَّلِ يَوْمٍ أَحَقُّ أَن تَقُومَ فِيهِ ﴾"
         data-en="…A mosque founded on righteousness from the first day is more worthy for you to stand in…">
        ﴿ لَّمَسْجِدٌ أُسِّسَ عَلَى التَّقْوَىٰ مِنْ أَوَّلِ يَوْمٍ أَحَقُّ أَن تَقُومَ فِيهِ ﴾
      </p>
      <p class="event-description"
         data-ar="اللبنة الأولى لتأسيس الدولة الإسلامية وبناء المجتمع بالمدينة المنورة."
         data-en="The very first pillar in establishing the Islamic state and community in Madinah.">
        اللبنة الأولى لتأسيس الدولة الإسلامية وبناء المجتمع بالمدينة المنورة.
      </p>
    </article>
  </main>

  <script src="app.js"></script>
</body>
</html>
