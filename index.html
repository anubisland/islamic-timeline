<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#063529" />
  <meta name="description" content="Interactive bilingual timeline of the Madani Era — the Hijra and the Battle of Badr." />
  <title data-ar="الخط الزمني للسيرة النبوية — العهد المدني" data-en="The Madani Era — Seerah Timeline">الخط الزمني للسيرة النبوية — العهد المدني</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- HEADER -->
  <header class="site-header">
    <div class="hdr-inner">
      <div class="brand">
        <div class="brand-logo">
          <svg viewBox="0 0 40 40" width="32" height="32" aria-hidden="true">
            <defs>
              <linearGradient id="brandg" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#6ee7b7"/>
                <stop offset="100%" stop-color="#064e3b"/>
              </linearGradient>
            </defs>
            <polygon points="20,4 24,15 36,15 26,22 30,33 20,26 10,33 14,22 4,15 16,15" fill="url(#brandg)" stroke="#C5A059" stroke-width="1"/>
            <circle cx="20" cy="20" r="3" fill="#C5A059"/>
          </svg>
        </div>
        <div class="brand-text">
          <div class="brand-title" data-ar="الخط الزمني للسيرة النبوية" data-en="The Madani Era Timeline">الخط الزمني للسيرة النبوية</div>
          <div class="brand-sub" data-ar="العهد المكي · الهجرة · بدر · العهد المدني — تفاعلي وثنائي اللغة" data-en="Meccan · Hijra · Badr · Medinan — Interactive & Bilingual">العهد المكي · الهجرة · بدر · العهد المدني — تفاعلي وثنائي اللغة</div>
        </div>
      </div>
      <div class="hdr-actions">
        <div class="event-switch" role="tablist">
          <button class="ev-btn" data-ev="meccan" data-ar="🕋 العهد المكي" data-en="🕋 Meccan Era">🕋 العهد المكي</button>
          <button class="ev-btn on" data-ev="hijra" data-ar="🧭 رحلة الهجرة" data-en="🧭 The Hijra">🧭 رحلة الهجرة</button>
          <button class="ev-btn" data-ev="badr" data-ar="⚔️ غزوة بدر" data-en="⚔️ Battle of Badr">⚔️ غزوة بدر</button>
          <button class="ev-btn" data-ev="medinan" data-ar="🏛️ العهد المدني" data-en="🏛️ Medinan Era">🏛️ العهد المدني</button>
        </div>
        <button id="langToggle" class="lang-button" type="button" aria-label="Toggle language">
          <span data-ar="English" data-en="العربية">English</span>
        </button>
      </div>
    </div>
    <div class="hdr-progress"><div id="hdr-prog"></div></div>
  </header>

  <!-- Diagnostic banner: shows current step + focus coordinates + TTS status.
       Visible only when needed. Confirms map↔step↔audio are in sync. -->
  <div id="focus-diag" class="focus-diag" aria-live="polite"></div>
  <div id="diag" class="diag diag-info" style="display:none" aria-live="polite"></div>

  <!-- MAIN GRID -->
  <main class="wrap">

    <!-- MAP PANEL -->
    <section class="map-panel">
      <div class="map-topbar">
        <span class="map-label">🗺️ <span id="map-label" data-ar="خريطة رحلة الهجرة النبوية" data-en="Map of the Hijra Journey">خريطة رحلة الهجرة النبوية</span></span>
        <div class="map-badges">
          <span class="mb mb-t" id="badge-time">🌙 ليلاً</span>
          <span class="mb mb-d" id="badge-dist">نقطة الانطلاق</span>
        </div>
        <div class="map-zoom" id="map-zoom" title="Map zoom controls">
          <button class="z-btn" id="z-out" type="button" aria-label="Zoom out">−</button>
          <button class="z-btn z-rst" id="z-rst" type="button" aria-label="Reset zoom" data-ar="100%" data-en="100%">100%</button>
          <button class="z-btn" id="z-in" type="button" aria-label="Zoom in">+</button>
        </div>
      </div>

      <!-- Shared SVG symbol library (camel, tent, dune, palm) -->
      <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <defs>
          <!-- Bedouin tent -->
          <symbol id="sym-tent" viewBox="0 0 60 40">
            <path d="M 4 36 L 30 6 L 56 36 Z" fill="#3a2e1c" stroke="#C5A059" stroke-width="1"/>
            <line x1="4" y1="36" x2="56" y2="36" stroke="#1a140a" stroke-width="2"/>
            <rect x="22" y="26" width="16" height="10" fill="#0a0a0a"/>
            <line x1="14" y1="22" x2="46" y2="22" stroke="#1a140a" stroke-width=".6" opacity=".5"/>
            <line x1="20" y1="14" x2="40" y2="14" stroke="#1a140a" stroke-width=".6" opacity=".5"/>
          </symbol>
          <!-- Camel (silhouette, walking right) -->
          <symbol id="sym-camel" viewBox="0 0 70 40">
            <path d="M 8 30
                     Q 6 18 14 16
                     L 18 8
                     Q 22 14 22 18
                     L 32 14
                     Q 36 6 40 14
                     L 50 14
                     Q 54 6 58 14
                     L 62 22
                     Q 66 24 66 30
                     L 60 32 L 60 36 L 56 36 L 56 32
                     L 38 32 L 38 36 L 34 36 L 34 32
                     L 14 32 L 14 36 L 10 36 L 10 32 Z"
                  fill="#2a1e10" stroke="#C5A059" stroke-width=".8" opacity=".85"/>
            <circle cx="62" cy="20" r="1.5" fill="#C5A059"/>
          </symbol>
          <!-- Sand dune -->
          <symbol id="sym-dune" viewBox="0 0 100 30">
            <path d="M 0 30 Q 25 4 50 18 Q 75 30 100 12 L 100 30 Z" fill="#5a4a32" opacity=".75"/>
            <path d="M 0 30 Q 25 4 50 18 Q 75 30 100 12" fill="none" stroke="#7a5e3a" stroke-width=".5" opacity=".4"/>
          </symbol>
          <!-- Mountain ridge -->
          <symbol id="sym-mountain" viewBox="0 0 120 50">
            <path d="M 0 50 L 30 14 L 50 30 L 80 8 L 120 50 Z" fill="#3a2e1c" stroke="#5a4a32" stroke-width="1" opacity=".7"/>
            <path d="M 30 14 L 38 22 M 80 8 L 90 18" stroke="#1a140a" stroke-width=".8" fill="none" opacity=".5"/>
          </symbol>
          <!-- Date palm -->
          <symbol id="sym-palm" viewBox="0 0 30 60">
            <path d="M 14 60 L 14 32" stroke="#3a2e1c" stroke-width="2" fill="none"/>
            <path d="M 14 32 Q 4 24 2 14 M 14 32 Q 24 24 26 14 M 14 32 Q 6 30 0 22 M 14 32 Q 22 30 28 22 M 14 32 Q 14 22 12 8 M 14 32 Q 14 22 16 8" stroke="#0d3a1c" stroke-width="2" fill="none" stroke-linecap="round"/>
            <ellipse cx="14" cy="32" rx="3" ry="2" fill="#5a3a1c"/>
          </symbol>
          <!-- Stars cluster -->
          <symbol id="sym-stars" viewBox="0 0 30 12">
            <polygon points="6,2 7,5 10,5 7.5,7 8.5,10 6,8 3.5,10 4.5,7 2,5 5,5" fill="#C5A059" opacity=".7"/>
            <polygon points="20,4 21,7 24,7 21.5,9 22.5,12 20,10 17.5,12 18.5,9 16,7 19,7" fill="#C5A059" opacity=".5"/>
          </symbol>
          <!-- Arabesque corner ornament (rotates) -->
          <symbol id="sym-arabesque" viewBox="0 0 60 60">
            <g fill="none" stroke="#C5A059" stroke-width="1" opacity=".75">
              <path d="M 0 30 Q 15 30 15 15 Q 15 0 30 0 Q 15 0 15 15 Q 15 30 0 30 Z"/>
              <path d="M 0 30 Q 8 22 8 14 Q 8 6 16 6"/>
              <circle cx="22" cy="22" r="2.2" fill="#C5A059"/>
              <path d="M 30 0 Q 38 8 46 8 M 30 0 Q 22 8 14 8"/>
            </g>
          </symbol>
          <!-- Islamic pendant (mihrab-shaped drop) -->
          <symbol id="sym-pendant" viewBox="0 0 30 50">
            <path d="M 15 0 L 27 14 L 27 32 Q 27 46 15 48 Q 3 46 3 32 L 3 14 Z"
                  fill="none" stroke="#C5A059" stroke-width="1" opacity=".7"/>
            <polygon points="15,8 19,16 15,24 11,16" fill="none" stroke="#C5A059" stroke-width=".8" opacity=".6"/>
            <circle cx="15" cy="34" r="2" fill="none" stroke="#C5A059" stroke-width=".8" opacity=".6"/>
          </symbol>
          <!-- Geometric 8-point star (large ornamental) -->
          <symbol id="sym-star8-lg" viewBox="0 0 100 100">
            <polygon points="50,4 60,30 86,18 76,44 96,50 76,56 86,82 60,70 50,96 40,70 14,82 24,56 4,50 24,44 14,18 40,30"
                     fill="none" stroke="#C5A059" stroke-width="1.2" opacity=".75"/>
            <polygon points="50,22 56,38 72,32 66,48 78,50 66,52 72,68 56,62 50,78 44,62 28,68 34,52 22,50 34,48 28,32 44,38"
                     fill="none" stroke="#C5A059" stroke-width=".6" opacity=".5"/>
            <circle cx="50" cy="50" r="3" fill="#C5A059" opacity=".6"/>
          </symbol>
          <!-- Crescent + star (Islamic symbol) -->
          <symbol id="sym-crescent" viewBox="0 0 40 40">
            <path d="M 28 4 A 18 18 0 1 0 28 36 A 14 14 0 1 1 28 4 Z"
                  fill="#C5A059" opacity=".75"/>
            <polygon points="34,8 36,13 41,13 37,16 38,21 34,18 30,21 31,16 27,13 32,13"
                     fill="#C5A059" opacity=".8"/>
          </symbol>
          <!-- Arched gate (mihrab / Bab) -->
          <symbol id="sym-arch" viewBox="0 0 80 100">
            <path d="M 10 100 L 10 30 Q 10 4 40 4 Q 70 4 70 30 L 70 100 Z"
                  fill="none" stroke="#C5A059" stroke-width="1" opacity=".7"/>
            <path d="M 18 100 L 18 32 Q 18 12 40 12 Q 62 12 62 32 L 62 100"
                  fill="none" stroke="#C5A059" stroke-width=".6" opacity=".5"/>
            <circle cx="40" cy="32" r="3" fill="#C5A059" opacity=".6"/>
          </symbol>
        </defs>
      </svg>

      <div class="svg-wrap" id="map-svg-wrap">

        <!-- HIJRA MAP -->
        <svg id="svg-hijra" class="map-svg" viewBox="0 0 700 560" preserveAspectRatio="xMidYMid meet" style="direction:ltr" xmlns="http://www.w3.org/2000/svg">
          <!-- Decorative 8-point star corners (static) -->
          <g class="map-frame" opacity=".55">
            <g transform="translate(14,14)"><polygon points="0,0 18,2 14,8 18,14 8,14 2,18 0,0 8,2 14,0" fill="#C5A059" opacity=".6"/></g>
            <g transform="translate(686,14) scale(-1,1)"><polygon points="0,0 18,2 14,8 18,14 8,14 2,18 0,0 8,2 14,0" fill="#C5A059" opacity=".6"/></g>
            <g transform="translate(14,546) scale(1,-1)"><polygon points="0,0 18,2 14,8 18,14 8,14 2,18 0,0 8,2 14,0" fill="#C5A059" opacity=".6"/></g>
            <g transform="translate(686,546) scale(-1,-1)"><polygon points="0,0 18,2 14,8 18,14 8,14 2,18 0,0 8,2 14,0" fill="#C5A059" opacity=".6"/></g>
          </g>
          <g class="map-pan" id="pan-hijra">
          <defs>
            <radialGradient id="hbg" cx="50%" cy="45%" r="62%">
              <stop offset="0%" stop-color="#041e14"/><stop offset="100%" stop-color="#010e09"/>
            </radialGradient>
            <filter id="gf"><feGaussianBlur stdDeviation="1.5" result="b"/>
              <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
          </defs>
          <rect width="700" height="500" fill="url(#hbg)"/>

          <!-- Stars -->
          <g opacity=".45">
            <circle cx="80"  cy="35" r="1"   fill="#fff"/>
            <circle cx="155" cy="22" r="1.2" fill="#fff"/>
            <circle cx="260" cy="48" r="1"   fill="#fff"/>
            <circle cx="400" cy="28" r="1.4" fill="#fff"/>
            <circle cx="520" cy="16" r="1"   fill="#fff"/>
            <circle cx="620" cy="42" r="1.2" fill="#fff"/>
            <circle cx="40"  cy="72" r=".8"  fill="#fff"/>
          </g>

          <!-- Red Sea -->
          <path d="M 0 200 Q 30 270 25 340 Q 30 410 15 480 L 0 500 Z" fill="#041d2e" stroke="#063a55" stroke-width="1.5" opacity=".85"/>
          <text data-ar="البحر الأحمر" data-en="Red Sea" x="18" y="360" fill="#0d4a6e" font-size="9" font-family="Tajawal,sans-serif"
                transform="rotate(-90,18,360)" text-anchor="middle" opacity=".8">البحر الأحمر</text>

          <!-- Sand dunes (foreground) -->
          <use href="#sym-dune" x="100" y="460" width="180" height="54" opacity=".55"/>
          <use href="#sym-dune" x="380" y="470" width="220" height="60" opacity=".55"/>
          <use href="#sym-dune" x="560" y="455" width="140" height="50" opacity=".5"/>

          <!-- Decorative Islamic ornaments -->
          <use href="#sym-arabesque" x="40"  y="40"  width="48" height="48" opacity=".55"/>
          <use href="#sym-arabesque" x="612" y="40"  width="48" height="48" opacity=".55" transform="scale(-1,1) translate(-1272,0)"/>
          <use href="#sym-star8-lg"  x="500" y="450" width="56" height="56" opacity=".32"/>
          <use href="#sym-pendant"   x="58"  y="100" width="18" height="30" opacity=".55"/>
          <use href="#sym-pendant"   x="624" y="100" width="18" height="30" opacity=".55"/>
          <use href="#sym-crescent"  x="600" y="100" width="28" height="28" opacity=".55"/>
          <use href="#sym-crescent"  x="72"  y="100" width="28" height="28" opacity=".55" transform="scale(-1,1) translate(-172,0)"/>

          <!-- Camel caravan (mid-route) -->
          <g opacity=".8">
            <use href="#sym-camel" x="170" y="380" width="40" height="22"/>
            <use href="#sym-camel" x="215" y="385" width="38" height="20"/>
            <use href="#sym-camel" x="258" y="382" width="40" height="22"/>
          </g>

          <!-- Bedouin tents near Qudayd -->
          <g opacity=".85">
            <use href="#sym-tent" x="130" y="245" width="40" height="26"/>
            <use href="#sym-tent" x="172" y="248" width="36" height="24"/>
          </g>

          <!-- Mountains -->
          <g fill="#0d2e1e" opacity=".65">
            <polygon points="295,520 315,490 335,520"/>
            <polygon points="315,520 340,482 365,520"/>
            <polygon points="340,520 360,488 380,520"/>
            <polygon points="362,520 380,494 398,520"/>
          </g>

          <!-- Land -->
          <path d="M 0 510 Q 175 500 350 508 Q 525 516 700 506 L700 560 L0 560Z" fill="#041a0f" opacity=".7"/>
          <path d="M 0 535 Q 200 525 400 532 Q 580 538 700 530 L700 560 L0 560Z" fill="#021208" opacity=".85"/>

          <!-- Usual route (dashed) -->
          <path d="M 350 480 Q 400 380 460 280 Q 500 200 540 140 Q 555 110 560 80"
                fill="none" stroke="#1a3828" stroke-width="1.5" stroke-dasharray="6 9" opacity=".5"/>
          <text data-ar="الطريق المعتاد" data-en="The Usual Route" x="490" y="300" fill="#213d2a" font-size="9" font-family="Tajawal,sans-serif"
                text-anchor="middle" opacity=".65">الطريق المعتاد</text>

          <!-- Actual Hijra route -->
          <path id="h-route-base" class="route-base"
                d="M 350 480 C 250 480 180 480 160 470 C 100 450 70 400 72 340 C 74 280 95 235 115 200 C 138 162 160 140 200 125 C 240 110 270 115 300 120 C 380 125 450 100 500 90 C 530 83 545 80 560 80"/>
          <path id="h-route-anim" class="route-anim"
                d="M 350 480 C 250 480 180 480 160 470 C 100 450 70 400 72 340 C 74 280 95 235 115 200 C 138 162 160 140 200 125 C 240 110 270 115 300 120 C 380 125 450 100 500 90 C 530 83 545 80 560 80"/>

          <!-- Node 0: Makkah -->
          <g class="cdn act" id="hnode-0">
            <circle class="pr" cx="350" cy="480" r="10"/>
            <circle class="cd" cx="350" cy="480" r="13" fill="#022c22" stroke="#C5A059" stroke-width="2.5"/>
            <circle cx="350" cy="480" r="5.5" fill="#C5A059"/>
            <text data-ar="مكة المكرمة 🕋" data-en="Makkah 🕋" x="350" y="458" fill="#f8fafc" font-size="12" font-weight="bold"
                  text-anchor="middle" font-family="Cairo,sans-serif">مكة المكرمة 🕋</text>
            <text data-ar="نقطة الانطلاق" data-en="Starting point" x="350" y="447" fill="#94a3b8" font-size="8.5" text-anchor="middle" font-family="Tajawal,sans-serif">نقطة الانطلاق</text>
          </g>

          <!-- Node 1: Cave of Thawr -->
          <g class="cdn" id="hnode-1">
            <circle class="pr" cx="180" cy="480" r="8"/>
            <circle class="cd" cx="180" cy="480" r="9" fill="#022c22" stroke="#C5A059" stroke-width="2"/>
            <circle cx="180" cy="480" r="4" fill="#064e3b"/>
            <text data-ar="غار ثور 🪨" data-en="Cave of Thawr 🪨" x="180" y="458" fill="#e2e8f0" font-size="10" text-anchor="middle" font-family="Cairo,sans-serif">غار ثور 🪨</text>
            <text data-ar="٣ أيام اختباء" data-en="3 days of hiding" x="180" y="447" fill="#64748b" font-size="8" text-anchor="middle" font-family="Tajawal,sans-serif">٣ أيام اختباء</text>
          </g>

          <!-- Node 2: Coastal route -->
          <g class="cdn" id="hnode-2">
            <circle class="pr" cx="80" cy="340" r="8"/>
            <circle class="cd" cx="80" cy="340" r="9" fill="#022c22" stroke="#C5A059" stroke-width="2"/>
            <circle cx="80" cy="340" r="4" fill="#064e3b"/>
            <text data-ar="الطريق الساحلي 🧭" data-en="Coastal Route 🧭" x="100" y="332" fill="#e2e8f0" font-size="10" text-anchor="start" font-family="Cairo,sans-serif">الطريق الساحلي 🧭</text>
            <text data-ar="مع ابن أُريقط" data-en="With Ibn Urayqit" x="100" y="344" fill="#64748b" font-size="8" text-anchor="start" font-family="Tajawal,sans-serif">مع ابن أُريقط</text>
          </g>

          <!-- Node 3: Qudayd / Umm Mabad -->
          <g class="cdn" id="hnode-3">
            <circle class="pr" cx="130" cy="200" r="8"/>
            <circle class="cd" cx="130" cy="200" r="9" fill="#022c22" stroke="#C5A059" stroke-width="2"/>
            <circle cx="130" cy="200" r="4" fill="#064e3b"/>
            <text data-ar="⛺ قُديد — أم معبد" data-en="⛺ Qudayd — Umm Mabad" x="152" y="194" fill="#e2e8f0" font-size="10" text-anchor="start" font-family="Cairo,sans-serif">⛺ قُديد — أم معبد</text>
            <text data-ar="معجزة الشاة الهزيلة" data-en="Miracle of the frail ewe" x="152" y="206" fill="#64748b" font-size="8" text-anchor="start" font-family="Tajawal,sans-serif">معجزة الشاة الهزيلة</text>
          </g>

          <!-- Node 4: Suraqah -->
          <g class="cdn" id="hnode-4">
            <circle class="pr" cx="300" cy="120" r="8"/>
            <circle class="cd" cx="300" cy="120" r="9" fill="#022c22" stroke="#C5A059" stroke-width="2"/>
            <circle cx="300" cy="120" r="4" fill="#064e3b"/>
            <text data-ar="🐎 مطاردة سراقة" data-en="🐎 Suraqah's Chase" x="320" y="114" fill="#e2e8f0" font-size="10" text-anchor="start" font-family="Cairo,sans-serif">🐎 مطاردة سراقة</text>
            <text data-ar="سوخ فرسه ٣ مرات" data-en="Horse sank 3 times" x="320" y="126" fill="#64748b" font-size="8" text-anchor="start" font-family="Tajawal,sans-serif">سوخ فرسه ٣ مرات</text>
          </g>

          <!-- Node 5: Madinah -->
          <g class="cdn" id="hnode-5">
            <circle class="pr" cx="560" cy="80" r="14"/>
            <circle class="cd" cx="560" cy="80" r="13" fill="#022c22" stroke="#6ee7b7" stroke-width="2.5"/>
            <circle cx="560" cy="80" r="5.5" fill="#6ee7b7"/>
            <text data-ar="المدينة المنورة 🕌" data-en="Madinah 🕌" x="560" y="56" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle" font-family="Cairo,sans-serif">المدينة المنورة 🕌</text>
            <text data-ar="الوصول والتأسيس" data-en="Arrival & Founding" x="560" y="45" fill="#6ee7b7" font-size="8.5" text-anchor="middle" font-family="Tajawal,sans-serif">الوصول والتأسيس</text>
          </g>

          <!-- Quba -->
          <g class="cdn-quba" id="hnode-quba">
            <circle cx="500" cy="95" r="5.5" fill="#022c22" stroke="#6ee7b7" stroke-width="1.5"/>
            <text data-ar="قُباء" data-en="Quba" x="500" y="112" fill="#6ee7b7" font-size="8.5" text-anchor="middle" font-family="Cairo,sans-serif">قُباء</text>
          </g>

          <!-- Legend -->
          <g transform="translate(10,10)">
            <rect width="120" height="62" rx="8" fill="rgba(1,10,7,.88)" stroke="rgba(197,160,89,.28)" stroke-width="1"/>
            <line x1="10" y1="18" x2="30" y2="18" stroke="#C5A059" stroke-width="2.5" stroke-dasharray="5 3"/>
            <text data-ar="مسار الهجرة" data-en="Hijra Route" x="34" y="22" fill="#94a3b8" font-size="8.5" font-family="Tajawal,sans-serif">مسار الهجرة</text>
            <line x1="10" y1="34" x2="30" y2="34" stroke="#1e3a28" stroke-width="1.5" stroke-dasharray="6 8"/>
            <text data-ar="الطريق المعتاد" data-en="Usual Route" x="34" y="38" fill="#475569" font-size="8.5" font-family="Tajawal,sans-serif">الطريق المعتاد</text>
            <circle cx="18" cy="52" r="4.5" fill="#C5A059"/>
            <text data-ar="محطة رئيسية" data-en="Main Station" x="34" y="56" fill="#94a3b8" font-size="8.5" font-family="Tajawal,sans-serif">محطة رئيسية</text>
          </g>

          <!-- 8-point Islamic star compass rose -->
          <g transform="translate(645,500)">
            <circle r="26" fill="rgba(2,16,12,.85)" stroke="rgba(197,160,89,.55)" stroke-width="1.5"/>
